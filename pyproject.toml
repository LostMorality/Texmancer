[project]
name = "texmancer"
version = "1.0.0"
description = "AI-upscaled textures for Wizard101, built on your own PC"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["numpy", "pillow", "spandrel", "torch"]

[project.scripts]
texmancer = "texmancer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["texmancer*"]
